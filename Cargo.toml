[package]
name = "liquid_neural_network"
version = "0.1.0"
edition = "2021"
description = "A Rust implementation of Liquid Neural Networks based on MIT CSAIL research"
license = "MIT"
repository = "https://github.com/laurence/lnnrs"

[dependencies]
csv = "1.3.0"
ndarray-rand = "0.14.0"
rand = "0.8.5"
serde = { version = "1.0.193", features = ["derive"] }
rand_distr = "0.4.3"
ndarray = { version = "0.15.6", features = ["rayon", "serde"] }
clap = { version = "4.4.11", features = ["derive"] }
log = "0.4.20"
env_logger = "0.11.0"
smartcore = "0.3.2"
rayon = "1.8.0"
nalgebra = "0.32.3"
thiserror = "1.0"

[dev-dependencies]
serde_json = "1.0.108"
approx = "0.5"
criterion = "0.5"
tempfile = "3.10"

[[bench]]
name = "network_benchmarks"
harness = false

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

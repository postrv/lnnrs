[package]
name = "liquid_neural_network"
version = "0.1.0"
edition = "2021"
description = "A Rust implementation of Liquid Neural Networks based on MIT CSAIL research"
license = "MIT"
repository = "https://github.com/postrv/lnnrs"

[lib]
name = "liquid_neural_network"
path = "src/lib.rs"

[[bin]]
name = "lnn"
path = "src/main.rs"

[dependencies]
csv = "1.3"
rand = "0.9"
serde = { version = "1.0.193", features = ["derive"] }
ndarray = { version = "0.16", features = ["serde"] }
clap = { version = "4.4.11", features = ["derive"] }
log = "0.4.20"
env_logger = "0.11"
thiserror = "2"
serde_json = "1.0.108"

[dev-dependencies]
approx = "0.5"
criterion = "0.7"
tempfile = "3.10"

[[bench]]
name = "network_benchmarks"
harness = false

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
